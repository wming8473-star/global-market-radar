name: Daily Global Market Radar

on:
  workflow_dispatch:
  schedule:
    # Beijing 08:30 and 15:30 on weekdays equals UTC 00:30 and 07:30.
    - cron: "30 0 * * 1-5"
    - cron: "30 7 * * 1-5"

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar
        timeout-minutes: 4
        run: python main.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/*.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "chore: update global market radar report"
          git pull --rebase origin main
          git push
